name: ci
# Pushes only to main: a branch with an open pull request would otherwise run every job
# twice (once for the push, once for the pull request).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # The tests never touch the network (tests/conftest.py blocks sockets): PyPI answers
      # are recorded fixtures, and --verify uses the trust root bundled with sigstore.
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy

  action:
    # Runs the action (installed from this checkout) against real PyPI on the example
    # requirements file — fastapi 0.142.2 is a real attestation regression — and checks
    # that it writes a SARIF. The SARIF is not uploaded: that finding is expected, and
    # findings on test fixtures would bury real alerts in the Security tab.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          lockfiles: tests/fixtures/lockfiles/requirements.txt
          verify: "true"
          fail: "false"
      - name: The action wrote a SARIF
        run: python -c 'import json, sys; json.load(open(sys.argv[1]))["runs"][0]["results"]' attest-lint.sarif
