name: ci
# Pushes only to main: a branch with an open pull request would otherwise run every job
# twice (once for the push, once for the pull request).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # The tests never touch the network (tests/conftest.py blocks sockets): PyPI answers
      # are recorded fixtures, and --verify uses the trust root bundled with sigstore.
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m mypy

  action:
    # Runs the action (installed from this checkout) against real PyPI on the example
    # requirements file — fastapi 0.142.2 is a real attestation regression — and uploads
    # the SARIF so it shows in the Security tab. A pull request from a fork gets a
    # read-only token and cannot upload SARIF, so the job only runs on pushes and on pull
    # requests from this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          lockfiles: tests/fixtures/lockfiles/requirements.txt
          verify: "true"
          fail: "false"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        if: always()
        with:
          sarif_file: attest-lint.sarif
          category: attest-lint
